name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the AppImage against an older glibc baseline for broad Linux compatibility.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: visualiser
            asset_name: raesboida-linux-x86_64
            artifact_path: release-output/raesboida-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: visualiser.exe
            asset_name: visualiser-windows-x86_64
            artifact_path: target/x86_64-pc-windows-msvc/release/visualiser.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux: install ALSA and PipeWire headers required by the audio capture crate.
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
        run: |
          mkdir -p release-output appimage-tools
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            --output appimage-tools/linuxdeploy-x86_64.AppImage
          echo "$LINUXDEPLOY_SHA256  appimage-tools/linuxdeploy-x86_64.AppImage" | sha256sum --check --status
          chmod +x appimage-tools/linuxdeploy-x86_64.AppImage
          (
            cd release-output
            ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ../appimage-tools/linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --executable ../target/${{ matrix.target }}/release/${{ matrix.artifact_name }} \
              --desktop-file ../packaging/linux/raesboida.desktop \
              --icon-file ../assets/icons/icon.svg \
              --output appimage
          )
          test -f release-output/raesboida-x86_64.AppImage
          tar -czf release-output/raesboida-linux-x86_64.tar.gz -C release-output raesboida-x86_64.AppImage

      - name: Verify Linux package
        if: runner.os == 'Linux'
        run: |
          mkdir package-check
          tar -xzf release-output/raesboida-linux-x86_64.tar.gz -C package-check
          test -x package-check/raesboida-x86_64.AppImage
          (
            cd package-check
            ./raesboida-x86_64.AppImage --appimage-extract
            test -x squashfs-root/AppRun
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: echo "tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage uniquely named release assets
        run: |
          mkdir release-assets
          cp artifacts/raesboida-linux-x86_64/raesboida-linux-x86_64.tar.gz release-assets/raesboida-linux-x86_64.tar.gz
          cp artifacts/visualiser-windows-x86_64/visualiser.exe release-assets/visualiser-windows-x86_64.exe
          sha256sum release-assets/* > release-assets/SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes \
            "Automated release for commit ${{ github.sha }} on \`main\`.

            Linux: download and extract \`raesboida-linux-x86_64.tar.gz\`, then launch \`raesboida-x86_64.AppImage\`. macOS builds are unavailable until the app can be signed and notarized." \
            release-assets/raesboida-linux-x86_64.tar.gz \
            release-assets/visualiser-windows-x86_64.exe \
            release-assets/SHA256SUMS
